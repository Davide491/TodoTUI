name: Compila per Windows

on:
  push:
    branches: [ "master" ]

jobs:
  build-windows:
    name: Build Eseguibile Windows
    runs-on: windows-latest # Avvia solo una macchina virtuale Windows nativa

    steps:
    - name: Scarica il codice dal repository
      uses: actions/checkout@v4

    - name: Configura Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Cambiala con la tua versione di Python se necessario

    - name: Installa PyInstaller e Dipendenze
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # Se usi librerie esterne, aggiungi i comandi "pip install" qui sotto, ad esempio:
        # pip install requests pandas

    - name: Esegui PyInstaller
      run: pyinstaller --onefile tuo_script.py # Ricordati di cambiare "tuo_script.py"

    - name: Carica l'eseguibile (.exe)
      uses: actions/upload-artifact@v4
      with:
        name: applicazione-windows
        path: dist/*.exe

